<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Mika — Redirecting…</title>
    <script src="/gate.js"></script>
    <script>
        (function () {
            try {
                // 1. URL param ?lang=xx — explicit override
                var params = location.search ? new URLSearchParams(location.search) : null;
                var force = params ? params.get('lang') : null;
                if (force) {
                    localStorage.setItem('mika-lang', force);
                    var target = '/' + force + '/';
                    if (force === 'en') target = '/en/';
                    location.replace(target);
                    return;
                }

                // 2. Saved preference or browser language
                var saved = localStorage.getItem('mika-lang');
                var lang = saved || (navigator.language || '').slice(0, 2).toLowerCase();

                if (lang === 'vi') location.replace('/vi/');
                else if (lang === 'de') location.replace('/de/');
                else if (lang === 'ko') location.replace('/ko/');
                else location.replace('/en/');
            } catch (e) {
                location.replace('/en/');
            }
        })();
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0;url=/en/">
    </noscript>
</head>
<body>
    <p>Redirecting… <a href="/en/">Click here</a> if not redirected.</p>
</body>
</html>
