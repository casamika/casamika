    <script>
        (function () {
            var SUPPORTED = ['vi', 'en', 'ko', 'de', 'zh', 'th', 'ru'];
            var go = function (l) { location.replace('/' + l + '/'); };
            try {
                // 1. URL param ?lang=xx — explicit override
                var params = location.search ? new URLSearchParams(location.search) : null;
                var force = params ? (params.get('lang') || '').toLowerCase().slice(0, 2) : '';
                if (SUPPORTED.indexOf(force) > -1) {
                    localStorage.setItem('mika-lang', force);
                    go(force);
                    return;
                }

                // 2. Saved preference, then browser languages (zh-TW/zh-HK cũng vào /zh/)
                var saved = localStorage.getItem('mika-lang');
                if (SUPPORTED.indexOf(saved) > -1) { go(saved); return; }
                var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
                for (var i = 0; i < prefs.length; i++) {
                    var l = String(prefs[i]).slice(0, 2).toLowerCase();
                    if (SUPPORTED.indexOf(l) > -1) { go(l); return; }
                }
                go('en');
            } catch (e) {
                go('en');
            }
        })();
    </script>
