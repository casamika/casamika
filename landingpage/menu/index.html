<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Menu — Casa Mika — Redirecting…</title>
    <script>
        (function () {
            try {
                var lang = localStorage.getItem('mika-lang') || 'en';
                location.replace('/' + lang + '/menu/');
            } catch (e) {
                location.replace('/en/menu/');
            }
        })();
    </script>
    <noscript><meta http-equiv="refresh" content="0;url=/en/menu/"></noscript>
</head>
<body>
    <p>Redirecting… <a href="/en/menu/">Click here</a></p>
</body>
</html>
