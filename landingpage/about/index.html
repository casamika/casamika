<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>About — Casa Mika — Redirecting…</title>
    <script>
        (function () {
            try {
                var lang = localStorage.getItem('mika-lang') || 'en';
                location.replace('/' + lang + '/about/');
            } catch (e) {
                location.replace('/en/about/');
            }
        })();
    </script>
    <noscript><meta http-equiv="refresh" content="0;url=/en/about/"></noscript>
</head>
<body>
    <p>Redirecting… <a href="/en/about/">Click here</a></p>
</body>
</html>
